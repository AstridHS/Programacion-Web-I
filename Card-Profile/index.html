<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Perfil > Astrid Trujillo</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <article class="profile-card">

    <figure class="profile-header">
      <img class="profile-photo" src="Astrid Trujillo photo.jpg" alt="Fotografía de Astrid Trujillo">
      <figcaption class="profile-details">
        <h2>Astrid Trujillo</h2>
        <p>Diseñadora Multimedia</p>
      </figcaption>
    </figure>

    <section class="profile-skills">
      <h3>Habilidades</h3>
      <ul class="skills-list">
        <li>Animación 2D</li>
        <li>Ilustración</li>
        <li>Motion Graphics</li>
      </ul>
    </section>

    <div class="profile-contact">
      <a class="contact-button" href="#">Enviar Mensaje</a>
      <div class="social-media">
        <img src="./twitter.svg" alt="Icono Twitter">
        <img src="./instagram.svg" alt="Icono Instagram">
        <img src="./twitch.svg" alt="Icono Twitch">
      </div>
    </div>

    <span class="status-badge">
      Disponible
    </span>

  </article>
</body>
</html>
